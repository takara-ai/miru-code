      <text x="83" y="251">Miru searches</text>
      <text x="83" y="394">Get relevant code</text>
    </g>
    <g class="sans" fill="#ffffff" fill-opacity=".68" font-size="25">
      <text x="83" y="147">“Where is authentication</text>
      <text x="83" y="180">configured?”</text>
      <text x="83" y="290">Embeddings + BM25</text>
      <text x="83" y="323">Code-aware ranking</text>
      <text x="83" y="433">File paths + line numbers</text>
      <text x="83" y="466">Focused source excerpts</text>
