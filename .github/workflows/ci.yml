name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install renderer and fonts
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-liberation
      - name: Render release card
        run: bun scripts/generate-release-card.ts --release-json tests/fixtures/release-card.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-card-preview
          path: dist/release-card/
          if-no-files-found: error

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Kiro plugin skills in sync
        run: |
          bun scripts/build-kiro-plugin.ts
          diff -rq skills .kiro-plugin/skills

  test:
    runs-on: ${{ matrix.os }}
    needs: lint-typecheck
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install ripgrep
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: bun run coverage

      - name: Check coverage badge
        if: matrix.os == 'ubuntu-latest'
        run: bun run scripts/update-coverage-badge.ts --check

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: bun test
