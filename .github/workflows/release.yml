name: Release Please

# Publishes with `bun pm pack` + `npm publish` (tarball upload).
#
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN or NPM_CONFIG_TOKEN.
# Configure on npmjs.com: Package → Settings → Trusted Publisher → GitHub Actions
#   Repository: takara-ai/miru-code, Workflow: release.yml, Environment: (none)
#
# `id-token: write` lets GitHub mint an OIDC token for npm provenance attestation.
# `actions/setup-node@v6` with `registry-url` wires npm to OIDC trusted publishing.
#
# `bun pm pack` skips lifecycle scripts, so prepublishOnly steps (vendor-grammars,
# typecheck, test) run explicitly before pack.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch or tag to publish
        required: true
        default: main
        type: string

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.event_name == 'push'
    uses: takara-ai/.github/.github/workflows/release-please.yml@main
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets: inherit

  publish:
    needs: release
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || needs.release.outputs.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install ripgrep
        timeout-minutes: 2
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi

          sudo env DEBIAN_FRONTEND=noninteractive apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ripgrep

      - name: Lint
        run: bun run lint

      - name: Prepublish checks
        run: bun run vendor-grammars && bun run typecheck && bun test

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Pack tarball
        run: bun pm pack

      - name: Publish to npm
        run: npm publish --access public ./takara-ai-miru-code-*.tgz
