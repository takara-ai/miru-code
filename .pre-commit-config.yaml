default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: bun run lint
        language: system
        pass_filenames: false

      - id: generate-static-skills
        name: regenerate caveman/ste skills + Claude sub-agent from installer source
        entry: bun scripts/generate-static-skills.ts
        language: system
        pass_filenames: false
        files: ^src/(installer/style-packs/|installer/search-policy\.ts|agents\.ts|agents/)

      - id: sync-kiro-plugin-skills
        name: sync .kiro-plugin/skills from skills/
        entry: bun scripts/build-kiro-plugin.ts
        language: system
        pass_filenames: false
        files: ^skills/
